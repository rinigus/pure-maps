name: Devcontainers

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  push:
    branches:
      - master
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qt5
            dockerfile: .devcontainer/debian-qt5/Dockerfile
            flavor: kirigami
            image_suffix: qt5
          - name: Qt6
            dockerfile: .devcontainer/fedora-qt6/Dockerfile
            flavor: kirigami6
            image_suffix: qt6
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pure-maps-devcontainer-${{ matrix.image_suffix }}
      PACKAGE_NAME: pure-maps-devcontainer-${{ matrix.image_suffix }}
      TEST_IMAGE: pure-maps-devcontainer-test:${{ matrix.image_suffix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} test image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=devcontainer-${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.image_suffix }}

      - name: Configure and build ${{ matrix.name }}
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace:ro" \
            ${{ env.TEST_IMAGE }} \
            sh -lc '
              cp -a /workspace/. /tmp/pure-maps-source &&
              cmake -S /tmp/pure-maps-source -B /tmp/pure-maps-build -G Ninja \
                -DFLAVOR=${{ matrix.flavor }} \
                -DRUN_FROM_SOURCE=OFF \
                -DUSE_BUNDLED_GEOCLUE2=ON \
                -DUSE_BUNDLED_GPXPY=ON &&
              cmake --build /tmp/pure-maps-build --parallel'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.name }} image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=devcontainer-${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.image_suffix }}

      - name: Keep the three newest ${{ matrix.name }} devcontainer versions
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          min-versions-to-keep: 3
          token: ${{ secrets.GITHUB_TOKEN }}
